<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="6.45in" height="1.94in" viewBox="0 0 929 279" role="img" aria-labelledby="title desc">
  <title id="title">Proposed development and evaluation workflow for the Colon-Roadmap model</title>
  <desc id="desc">The development lane converts historical CT colonography scans into corrected masks, centrelines and landmarks before building generic and patient-tailored population models. The independent-evaluation lane applies a fixed reference procedure to held-out patients and assesses anatomical fidelity, uncertainty and subgroup performance.</desc>
  <defs>
    <style>
      .label { font-family: Calibri, Arial, sans-serif; font-size: 18px; font-weight: 600; fill: #163A59; }
      .lane { font-family: Calibri, Arial, sans-serif; font-size: 15px; font-weight: 700; letter-spacing: 0.5px; fill: #5C6773; }
      .arrow { fill: none; stroke: #5C6773; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>
  <rect width="929" height="279" fill="#FFFFFF"/>
  <text class="lane" x="15" y="17">DEVELOPMENT</text>
  <text class="lane" x="15" y="147">INDEPENDENT EVALUATION</text>
  <path d="M215,60 L242,60" class="arrow"/><polygon points="242,60 232.0,64.0 232.0,56.0" fill="#5C6773"/><path d="M442,60 L469,60" class="arrow"/><polygon points="469,60 459.0,64.0 459.0,56.0" fill="#5C6773"/><path d="M669,60 L696,60" class="arrow"/><polygon points="696,60 686.0,64.0 686.0,56.0" fill="#5C6773"/><path d="M215,190 L242,190" class="arrow"/><polygon points="242,190 232.0,194.0 232.0,186.0" fill="#5C6773"/><path d="M442,190 L469,190" class="arrow"/><polygon points="469,190 459.0,194.0 459.0,186.0" fill="#5C6773"/><path d="M669,190 L696,190" class="arrow"/><polygon points="696,190 686.0,194.0 686.0,186.0" fill="#5C6773"/><path d="M796,95 L569,155" class="arrow"/><polygon points="569,155 577.6,148.6 579.7,156.3" fill="#5C6773"/>
  <rect x="15" y="25" width="200" height="70" rx="8" fill="#EAF2F8" stroke="#2E5E86" stroke-width="1.5"/><text class="label" text-anchor="middle"><tspan x="115.0" y="55.0">Historical CTC</tspan><tspan x="115.0" y="73.0">scans</tspan></text><rect x="242" y="25" width="200" height="70" rx="8" fill="#F4F6F9" stroke="#2E5E86" stroke-width="1.5"/><text class="label" text-anchor="middle"><tspan x="342.0" y="55.0">Data, metadata and</tspan><tspan x="342.0" y="73.0">eligibility audit</tspan></text><rect x="469" y="25" width="200" height="70" rx="8" fill="#EAF2F8" stroke="#2E5E86" stroke-width="1.5"/><text class="label" text-anchor="middle"><tspan x="569.0" y="46.0">Corrected masks,</tspan><tspan x="569.0" y="64.0">centrelines and</tspan><tspan x="569.0" y="82.0">landmarks</tspan></text><rect x="696" y="25" width="200" height="70" rx="8" fill="#DCEAF5" stroke="#2E5E86" stroke-width="1.5"/><text class="label" text-anchor="middle"><tspan x="796.0" y="55.0">Generic and</tspan><tspan x="796.0" y="73.0">tailored models</tspan></text><rect x="15" y="155" width="200" height="70" rx="8" fill="#F4F6F9" stroke="#2E5E86" stroke-width="1.5"/><text class="label" text-anchor="middle"><tspan x="115.0" y="185.0">Held-out CTC</tspan><tspan x="115.0" y="203.0">cases</tspan></text><rect x="242" y="155" width="200" height="70" rx="8" fill="#EAF2F8" stroke="#2E5E86" stroke-width="1.5"/><text class="label" text-anchor="middle"><tspan x="342.0" y="185.0">Fixed reference and</tspan><tspan x="342.0" y="203.0">alignment procedure</tspan></text><rect x="469" y="155" width="200" height="70" rx="8" fill="#F4F6F9" stroke="#2E5E86" stroke-width="1.5"/><text class="label" text-anchor="middle"><tspan x="569.0" y="185.0">Patient-level</tspan><tspan x="569.0" y="203.0">anatomy tests</tspan></text><rect x="696" y="155" width="200" height="70" rx="8" fill="#EEF5E9" stroke="#2E5E86" stroke-width="1.5"/><text class="label" text-anchor="middle"><tspan x="796.0" y="185.0">Fidelity, uncertainty</tspan><tspan x="796.0" y="203.0">and subgroup checks</tspan></text>
</svg>
